<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول - Pirates World</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #eef2f3;
      padding: 0;
      margin: 0;
    }

    .container {
      max-width: 500px;
      margin: 60px auto;
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #0a0a23;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #333;
    }

    .error {
      color: red;
      display: none;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .images {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
    }

    .images img {
      width: 100px;
      height: auto;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>تسجيل الدخول</h2>

    <div class="error" id="error">البريد الإلكتروني أو كلمة المرور غير صحيحة.</div>

    <label for="email">البريد الإلكتروني:</label>
    <input type="email" id="email" required>

    <label for="password">كلمة المرور:</label>
    <input type="password" id="password" required>

    <button onclick="login()">تسجيل الدخول</button>

    <div class="images">
      <img src="images/zdf.jpeg" alt="أنمي">
      <img src="images/zoi.jpg" alt="أنمي">
      <img src="images/zoro.jpg" alt="أنمي">
      <img src="images/zxc.jpeg" alt="أنمي">
    </div>
  </div>

  <script src="js/script.js"></script> <!-- ربط الجافا سكريبت بالصفحة -->

  <script>
    function login() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const error = document.getElementById("error");

      // مجرد محاكاة، في الحقيقة لازم backend
      if (email === "test@example.com" && password === "123456") {
        alert("تم تسجيل الدخول بنجاح!");
        error.style.display = "none";
      } else {
        error.style.display = "block";
      }
    }
  </script>

</body>
</html>
