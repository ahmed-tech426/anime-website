<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>إنشاء حساب - Pirates World</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7fa;
      padding: 0;
      margin: 0;
    }

    .container {
      max-width: 500px;
      margin: 60px auto;
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #0a0a23;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #333;
    }

    .google-btn {
      width: 100%;
      padding: 12px;
      background-color: #db4437;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 16px;
      margin-top: 10px;
      cursor: pointer;
    }

    .google-btn:hover {
      background-color: #c1351d;
    }

    .images {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
    }

    .images img {
      width: 100px;
      height: auto;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>إنشاء حساب</h2>

    <label for="name">الاسم:</label>
    <input type="text" id="name" required>

    <label for="phone">رقم الهاتف:</label>
    <input type="tel" id="phone" required>

    <label for="email">البريد الإلكتروني:</label>
    <input type="email" id="email" required>

    <label for="password">كلمة المرور:</label>
    <input type="password" id="password" required>

    <label for="confirm-password">تأكيد كلمة المرور:</label>
    <input type="password" id="confirm-password" required>

    <button onclick="register()">إنشاء الحساب</button>

    <button class="google-btn">تسجيل باستخدام جوجل</button>

    <div class="images">
      <img src="images/irn.jpeg" alt="أنمي">
      <img src="images/luffy 2.jpg" alt="أنمي">
      <img src="images/zjn.jpg" alt="أنمي">
      <img src="images/imo samaa.jpg" alt="أنمي">
    </div>
  </div>

  <script src="js/script.js"></script> <!-- ربط الجافا سكريبت بالصفحة -->

  <script>
    function register() {
      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm-password").value;

      if (password === confirmPassword) {
        alert("تم إنشاء الحساب بنجاح!");
      } else {
        alert("كلمات المرور غير متطابقة.");
      }
    }
  </script>

</body>
</html>
